name: "AwkGearMastery"
version: "${version}"
main: "dev.s3tupw1zard.awkgearmastery.AwkGearMasteryPlugin"
authors:
  - byteful
  - s3tupw1zard
description: "Configurable RPG-style equipment progression for Paper and Purpur with formula-based leveling and combat XP sharing. Based on open-source work originally authored by byteful."
website: "https://github.com/s3tupw1zard/AwkGearMastery"
api-version: "26.2"
folia-supported: true
softdepend:
  - PlaceholderAPI
permissions:
  awkgearmastery.admin:
    description: "Permission to use admin commands."
    default: op
  awkgearmastery.enabled:
    description: "Permission to let a player level up a tool."
    default: true
  awkgearmastery.formula.*:
    description: "Wildcard permission for configured XP formulas."
    default: false
