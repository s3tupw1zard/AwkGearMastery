name: "AwkGearMastery"
version: "${version}"
main: "dev.s3tupw1zard.awkgearmastery.LevelToolsPlugin"
authors:
  - byteful
  - s3tupw1zard
description: "Configurable RPG-style equipment progression for Paper and Purpur with formula-based leveling and combat XP sharing. Based on LevelTools by byteful."
website: "https://github.com/s3tupw1zard/LevelTools"
api-version: "26.2"
folia-supported: true
softdepend:
  - PlaceholderAPI
permissions:
  leveltools.admin:
    description: "Permission to use admin commands."
    default: op
  leveltools.enabled:
    description: "Permission to let a player level up a tool."
    default: true
  leveltools.formula.*:
    description: "Wildcard permission for configured XP formulas."
    default: false
