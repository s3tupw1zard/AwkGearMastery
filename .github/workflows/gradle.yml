name: Java CI with Gradle

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build against Paper 26.3
        run: ./gradlew build --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AwkGearMastery-paper-26.3-java25
          path: build/libs/*.jar
          if-no-files-found: error


  compatibility:
    name: Paper ${{ matrix.minecraft }} startup
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: AwkGearMastery-paper-26.3-java25
          path: smoke-plugin
      - name: Start the same JAR on the selected Paper server
        run: python3 .github/scripts/paper_smoke.py '${{ matrix.minecraft }}' smoke-plugin
      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.minecraft }}-startup-log
          path: smoke-server/console.log
          if-no-files-found: ignore
