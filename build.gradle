plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id("com.gradleup.shadow") version "9.6.1"
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    maven {
        url = uri('https://oss.sonatype.org/content/groups/public/')
    }
    maven {
        url = uri('https://repo.codemc.org/repository/maven-public/')
    }
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = uri('https://redempt.dev')
    }
    maven {
        url = uri('https://jitpack.io')
    }
    maven {
        url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/')
    }
    maven {
        url = uri('https://hub.jeff-media.com/nexus/repository/jeff-media-public/')
    }
}

// Compile the distributed JAR against the oldest supported API to avoid accidental
// references to methods/classes that only exist on the recommended server version.
def minimumPaperApi = '1.21.11-R0.1-SNAPSHOT'
def testPaperApi = providers.gradleProperty('paperTestApi').getOrElse(minimumPaperApi)

dependencies {
    implementation 'com.github.Redempt:Crunch:2.0.3'
    implementation 'com.github.cryptomorin:XSeries:13.7.1'
    implementation 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    implementation 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'
    implementation 'com.jeff-media:MorePersistentDataTypes:2.4.0'

    compileOnly "io.papermc.paper:paper-api:${minimumPaperApi}"
    compileOnly 'net.kyori:adventure-api:4.26.1'
    compileOnly 'net.kyori:adventure-platform-bukkit:4.4.1'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'me.clip:placeholderapi:2.12.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation "io.papermc.paper:paper-api:${testPaperApi}"
    testImplementation 'org.mockito:mockito-core:5.21.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

group = 'dev.s3tupw1zard'
version = '2026.1.0-rc.2-SNAPSHOT'
description = 'AwkGearMastery - configurable RPG-style equipment progression for Paper and Purpur'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

shadowJar {
    minimize {
        exclude(dependency('io.github.revxrsal:.*:.*'))
    }
    archiveBaseName.set("AwkGearMastery")
    archiveClassifier.set("")

    relocate "com.cryptomorin.xseries", "dev.s3tupw1zard.awkgearmastery.libs.xseries"
    relocate "redempt.crunch", "dev.s3tupw1zard.awkgearmastery.libs.crunch"
    relocate 'revxrsal.commands', 'dev.s3tupw1zard.awkgearmastery.libs.lamp'
    relocate 'com.jeff-media.morepersistentdatatypes', 'dev.s3tupw1zard.awkgearmastery.libs.morepersistentdatatypes'
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(25)
    options.compilerArgs += ["-parameters", "-Xlint:all", "-Werror"]
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-javaagent:' + configurations.testRuntimeClasspath.find { it.name.startsWith('mockito-core-') }.absolutePath
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.build.dependsOn += shadowJar
